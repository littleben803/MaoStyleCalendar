<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>桌面小组件 · 搜索结果 v2</title>
<style>
@font-face{font-family:Han;src:url('../20261113-zh-Hans-v1/fonts/SourceHanSerifSC-Bold.otf');font-weight:700}
@font-face{font-family:Han;src:url('../20261113-zh-Hans-v1/fonts/SourceHanSerifSC-Regular.otf');font-weight:400}
*{box-sizing:border-box}html,body{margin:0;width:3840px;height:2560px;overflow:hidden}
body{background:#8e1017;font-family:Han;color:#fff2d9}
.background{position:absolute;inset:0;width:3840px;height:2560px;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(100deg,#30000d77 0%,#43000e28 47%,transparent 76%)}
.copy{position:absolute;left:850px;top:875px;width:1200px;height:800px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-size:255px;line-height:1.18;font-weight:700;letter-spacing:3px;white-space:nowrap;text-shadow:0 5px 20px #40000c44}
p{margin:48px 0 0;font-size:100px;line-height:1.25;font-weight:400;white-space:nowrap;text-shadow:0 3px 15px #40000c44}
.art{position:absolute;left:1740px;top:235px;width:1600px;height:2190px;object-fit:contain;filter:drop-shadow(0 24px 30px #43000655)}
</style>
<body>
<img class="background" src="../20261113-zh-Hans-v1/background-source.png" alt="">
<div class="shade"></div>
<div class="copy" data-key><h1>好句子，<br>就在桌面</h1><p>每日语录，<br>遇见手绘之美</p></div>
<img class="art" src="../20261113-zh-Hans-v1/assets/widgets-phone.png" alt="">
</body>
</html>
